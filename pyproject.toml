[project]
name = "kaiwa"
version = "0.1.0"
description = "A Flask-based conversational voice agent."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
]

[project.scripts]
kaiwa = "kaiwa:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
