[project]
name = "kaiwa"
version = "0.1.0"
description = "A Flask-based conversational voice agent."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "langchain>=1.0.0",
    "langchain-openrouter>=0.1.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
kaiwa = "kaiwa:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
